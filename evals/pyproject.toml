[project]
name = "asset-iq-evals"
version = "0.1.0"
description = "Retrieval + answer-quality evals for Asset IQ"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.9.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
