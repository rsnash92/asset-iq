[project]
name = "asset-iq-sample-corpus"
version = "0.1.0"
description = "Download and seed the Asset IQ sample corpus (UK HSE, OGL v3)"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28"]

[dependency-groups]
dev = ["ruff>=0.15"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
